[project]
name = "schedule-bot"
version = "0.1.0"
description = "Telegram-бот расписания и замен"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "python-dotenv>=1.0",
]

[project.scripts]
schedule-bot = "schedule_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schedule_bot"]
