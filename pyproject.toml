[project]
name = "schedule-bot"
version = "0.1.0"
description = "Telegram-бот расписания и замен"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "httpx>=0.27",
    "tzdata",  # часовой пояс Europe/Moscow — на случай сервера без системной tzdb
]

[project.optional-dependencies]
# Сборка PNG из SVG (scripts/render_assets.py). Не нужно боту в рантайме.
assets = ["svglib>=1.5", "rlPyCairo>=0.3"]

[project.scripts]
schedule-bot = "schedule_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schedule_bot"]
artifacts = ["schedule_bot/assets/*.png", "schedule_bot/assets/*.svg"]
