services:
  bot:
    build: .
    image: schedule-bot
    container_name: schedule-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      autoheal: "true"

  # Раскомментируй, чтобы контейнер сам перезапускался, если healthcheck
  # покажет «завис» (обычный restart: unless-stopped на unhealthy не реагирует).
  # autoheal:
  #   image: willfarrell/autoheal
  #   restart: unless-stopped
  #   environment:
  #     AUTOHEAL_CONTAINER_LABEL: autoheal
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock

volumes:
  bot-data:
